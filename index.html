<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>مصطلحات التمريض الطبية</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14202e;--mu:#5d6b7c;--bd:#dbe3ec;--pri:#0b7ea8;--pri2:#e3f3f9;--ok:#1b9a5b;--okbg:#e4f6ec;--bad:#d1384b;--badbg:#fdeaed;--warn:#b26a00;--warnbg:#fff4dd;--gold:#9a6700;--sh:0 2px 10px rgba(20,32,46,.07)}
:root[data-theme=dark]{--bg:#0e1621;--card:#17222f;--tx:#e8eef5;--mu:#97a6b8;--bd:#2a3a4c;--pri:#4fc3e8;--pri2:#16354a;--ok:#4cc88a;--okbg:#14382a;--bad:#ff7a8a;--badbg:#3d1b22;--warn:#f0b04a;--warnbg:#3a2d12;--gold:#e6c35c;--sh:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1621;--card:#17222f;--tx:#e8eef5;--mu:#97a6b8;--bd:#2a3a4c;--pri:#4fc3e8;--pri2:#16354a;--ok:#4cc88a;--okbg:#14382a;--bad:#ff7a8a;--badbg:#3d1b22;--warn:#f0b04a;--warnbg:#3a2d12;--gold:#e6c35c;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,"Droid Arabic Naskh",system-ui,sans-serif;font-size:17px;line-height:1.65}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#side{background:var(--card);border-inline-end:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{font-weight:800;font-size:1.05rem;padding:8px 10px 14px;color:var(--pri)}
#side a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--tx);text-decoration:none;margin-bottom:4px;font-weight:600}
#side a.on{background:var(--pri2);color:var(--pri)}
#main{padding:18px 22px 90px;max-width:900px;width:100%;margin:0 auto}
#bottom{display:none}
h1{font-size:1.5rem;margin:.2em 0 .5em}h2{font-size:1.25rem;margin:.2em 0 .5em}h3{font-size:1.05rem;margin:.2em 0 .5em}
.muted{color:var(--mu)}.small{font-size:.85rem}.c{text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card.hero{background:linear-gradient(135deg,var(--pri2),var(--card))}
.card.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.card.err{background:var(--badbg);color:var(--bad)}
.card.link{display:block;text-decoration:none;color:var(--tx);font-weight:700;text-align:center;padding:20px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}.row.c{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer;text-decoration:none;min-height:46px}
.btn.big{padding:14px 26px;font-size:1.05rem}.btn.sm{padding:6px 12px;min-height:36px;font-size:.85rem}
.btn.alt{background:var(--pri2);color:var(--pri)}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.ok2{background:#12805a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-weight:500;font-size:.72rem;opacity:.85}
select,input[type=search],input[type=text],input[type=number],input:not([type]),input[type=file]{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:44px;max-width:100%}
input[type=search]{width:100%;margin-bottom:8px}input.num{width:90px}input[type=range]{width:100%;min-height:36px}
label{display:block;margin:10px 0 4px;font-weight:600}label.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.form{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.form label{margin:6px 0 0}.form input,.form select{width:100%}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.pron{display:inline-block;background:var(--warnbg);color:var(--gold);padding:2px 12px;border-radius:999px;font-weight:700;margin:4px 0}.pron.sm{padding:0 8px;font-size:.85rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--pri2);color:var(--pri);font-size:.78rem;font-weight:700}
.chip.new{background:var(--warnbg);color:var(--warn)}.chip.mastered,.chip.ok{background:var(--okbg);color:var(--ok)}.chip.learning{background:var(--badbg);color:var(--bad)}.chip.link{text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.tile b{display:block;font-size:1.5rem;color:var(--pri)}.tile small{display:block;color:var(--mu);font-size:.78rem}
.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0 14px}.plan b{font-size:1.9rem;display:block;color:var(--pri)}.plan small{color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}.bar.sm{height:7px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;color:var(--tx);text-decoration:none}
.li.static{border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:8px 2px;background:none}.li.err{color:var(--bad)}
.li-side{display:flex;gap:6px;align-items:center;flex-shrink:0}
.fc{text-align:center;padding:22px 16px}.fc-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fc-term{font-size:2.3rem;margin:10px 0 2px;line-height:1.2}.fc-term .en{font-size:inherit}.fc-mean{font-size:1.8rem;font-weight:800;color:var(--pri);margin:6px 0}
.fc p{margin:6px 0}.ex{background:var(--pri2);border-radius:12px;padding:10px;margin:10px 0}
.warnt{color:var(--warn)}hr{border:0;border-top:1px dashed var(--bd);margin:14px 0}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:50%;width:44px;height:44px;font-size:1.15rem;cursor:pointer;margin:0 3px}.ib.playing{background:var(--pri2);transform:scale(1.1)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.grades .btn{flex-direction:column;padding:10px 4px}
.sess-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{font:inherit;text-align:center;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:14px 8px;cursor:pointer;min-height:60px}.opt small{display:block;color:var(--gold);font-weight:700}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt-card{border:2px solid var(--bd);border-radius:14px;padding:12px;display:block;cursor:pointer;margin:0}.opt-card:has(input:checked){border-color:var(--pri);background:var(--pri2)}.opt-card small{display:block;color:var(--mu);font-weight:400}.opt-card input{margin-inline-end:6px}
.spell{direction:ltr;text-align:center;font-size:1.4rem;width:100%;margin:12px 0}.spell.right{border-color:var(--ok);background:var(--okbg)}.spell.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px;margin:10px 0;background:var(--pri2)}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb .muted{color:inherit;opacity:.85}
.bad{color:var(--bad)}.okt{color:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:8px}.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.chart i{width:100%;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}.chart small{font-size:.62rem;color:var(--mu)}
.cp{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 60px;gap:8px;align-items:center;margin:4px 0}.cp small{color:var(--mu);text-align:center}
.back{display:inline-block;margin-bottom:6px;color:var(--pri);text-decoration:none;font-weight:700}
details{margin:6px 0}summary{cursor:pointer;font-weight:700}
#toast{position:fixed;inset-inline:12px;bottom:78px;max-width:520px;margin-inline:auto;background:#222;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;text-align:center}
#toast.show{opacity:1}#toast.ok{background:#157a4b}#toast.bad{background:#b3283b}
@media(max-width:899px){
 #app{display:block}#side{display:none}
 #main{padding:14px 14px 96px}
 #bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);z-index:20;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
 #bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;text-decoration:none;color:var(--mu);font-size:.72rem;font-weight:700;padding:5px 0}#bottom a span{font-size:1.35rem;line-height:1.2}#bottom a.on{color:var(--pri)}
 .fc-term{font-size:2rem}.grades .btn{font-size:.85rem}.form{grid-template-columns:1fr}
}
@media(max-width:480px){.opts{grid-template-columns:1fr}.grid2{grid-template-columns:1fr 1fr}.cp{grid-template-columns:1fr 1fr 48px}}

.ex .ib{width:36px;height:36px;font-size:1rem;margin:0 2px}.ex .en{font-weight:600}

</style>
</head>

  lab: { ar: 'التحاليل والفحوصات', i: '🔬' }, vitals: { ar: 'العلامات الحيوية', i: '🌡️' },
  nursing: { ar: 'التمريض ورعاية المرضى', i: '🩺' }, infection: { ar: 'مكافحة العدوى', i: '🧼' },
  emergency: { ar: 'الطوارئ والإسعاف', i: '🚑' }, surgery: { ar: 'الجراحة', i: '🔪' },
  mental: { ar: 'الصحة النفسية', i: '🧘' }, hospital: { ar: 'المستشفى والأقسام', i: '🏥' },
  abbrev: { ar: 'الاختصارات الطبية', i: '🔤' }, affix: { ar: 'السوابق واللواحق والجذور', i: '🧩' }
};
window.LEVELS = { 1: 'المستوى 1 — التأسيس', 2: 'المستوى 2 — الأساسيات', 3: 'المستوى 3 — التمريض', 4: 'المستوى 4 — المتقدم' };
window.POS_AR = { noun: 'اسم', verb: 'فعل', adjective: 'صفة', abbreviation: 'اختصار', prefix: 'سابقة', suffix: 'لاحقة', root: 'جذر', phrase: 'عبارة' };

window.Util = (function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /* نفس قاعدة التوحيد المستخدمة في بايثون وSQL: قص + دمج المسافات + حروف صغيرة */
  const normKey = s => String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase();
  /* توحيد العربية للبحث: حذف التشكيل وتوحيد الألف والياء والتاء المربوطة */
  const normAr = s => String(s == null ? '' : s).toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  const pad = n => String(n).padStart(2, '0');
  const dayStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => dayStr(new Date());
  const addDays = (ds, n) => { const [y, m, d] = ds.split('-').map(Number); const t = new Date(y, m - 1, d + n); return dayStr(t); };
  const diffDays = (a, b) => { const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((new Date(pb[0], pb[1] - 1, pb[2]) - new Date(pa[0], pa[1] - 1, pa[2])) / 864e5); };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const num = n => Number(n).toLocaleString('ar-EG');
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
  /* هاش بسيط (cyrb53) لاكتشاف تلف ملف النسخة الاحتياطية — لا يصلح كحماية ضد التلاعب */
  const hash = (str) => {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  return { esc, normKey, normAr, today, addDays, diffDays, shuffle, num, pct, hash, debounce, dayStr };
})();

<script>
/* js/db.js */
/* قاعدة بيانات محلية دائمة (IndexedDB). كل شيء داخل جهازك فقط.
   منع التكرار: مفتاح مخزن المصطلحات هو term_key نفسه، فأي add() مكرر يُرفض من المتصفح (ConstraintError). */
window.DB = (function () {
  const NAME = 'nursing-terms', VER = 1;
  let dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB غير مدعومة في هذا المتصفح'));
      const r = indexedDB.open(NAME, VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        const t = db.createObjectStore('terms', { keyPath: 'k' });
        t.createIndex('c', 'c'); t.createIndex('l', 'l');
        db.createObjectStore('progress', { keyPath: 'k' });
        db.createObjectStore('quizzes', { keyPath: 'id', autoIncrement: true });
        db.createObjectStore('days', { keyPath: 'day' });
        db.createObjectStore('meta', { keyPath: 'key' });
        db.createObjectStore('imports', { keyPath: 'id', autoIncrement: true });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('أغلق نوافذ التطبيق الأخرى ثم أعد المحاولة'));
    });
    return dbp;
  }

  const run = (stores, mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction(stores, mode);
    let out;
    t.oncomplete = () => res(typeof out === 'function' ? out() : out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('تم إلغاء العملية'));
    out = fn(t);
  }));

  const getAll = store => run(store, 'readonly', t => { const r = t.objectStore(store).getAll(); return () => r.result; });
  const get = (store, key) => run(store, 'readonly', t => { const r = t.objectStore(store).get(key); return () => r.result; });
  const put = (store, val) => run(store, 'readwrite', t => { t.objectStore(store).put(val); });
  const putMany = (store, arr) => run(store, 'readwrite', t => { const s = t.objectStore(store); arr.forEach(v => s.put(v)); });
  const clear = store => run(store, 'readwrite', t => { t.objectStore(store).clear(); });
  const del = (store, key) => run(store, 'readwrite', t => { t.objectStore(store).delete(key); });
  const count = store => run(store, 'readonly', t => { const r = t.objectStore(store).count(); return () => r.result; });

  /* إضافة مصطلحات على دفعات: المكرر يُحسب ولا يُضاف، ولا يتوقف الباقي */
  async function addTerms(list, batch = 250) {
    let added = 0, dup = 0; const addedKeys = [];
    for (let i = 0; i < list.length; i += batch) {
      const chunk = list.slice(i, i + batch);
      await run('terms', 'readwrite', t => {
        const s = t.objectStore('terms');
        chunk.forEach(rec => {
          const rq = s.add(rec);
          rq.onsuccess = () => { added++; addedKeys.push(rec.k); };
          rq.onerror = e => {
            if (rq.error && rq.error.name === 'ConstraintError') { dup++; e.preventDefault(); e.stopPropagation(); }
          };
        });
      });
    }
    return { added, dup, addedKeys };
  }

  const getMeta = async (key, def) => { const r = await get('meta', key); return r ? r.value : def; };
  const setMeta = (key, value) => put('meta', { key, value });

  async function requestPersist() {
    try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) { }
    return false;
  }
  async function isPersisted() {
    try { if (navigator.storage && navigator.storage.persisted) return await navigator.storage.persisted(); } catch (e) { }
    return false;
  }

  return { open, getAll, get, put, putMany, clear, del, count, addTerms, getMeta, setMeta, requestPersist, isPersisted };
})();

</script>
<script>
/* js/core.js */
/* محرك المراجعة المتباعدة + النطق الصوتي */
window.SRS = (function () {
  const blank = k => ({ k, ease: 2.5, interval: 0, due: null, reps: 0, lapses: 0, correct: 0, wrong: 0, fav: false, hardFlag: false, first: null, last: null });

  /* g: 0 نسيته | 1 صعب | 2 جيد | 3 سهل */
  function grade(p0, g, today) {
    const p = Object.assign(blank(p0.k), p0), now = Date.now();
    if (!p.first) p.first = now;
    p.last = now;
    if (g === 0) {
      p.lapses++; p.wrong++; p.ease = Math.max(1.3, p.ease - 0.2); p.interval = 0; p.reps = 0; p.due = today;
    } else {
      p.correct++; p.reps++;
      if (p.reps === 1) p.interval = [0, 1, 1, 3][g];
      else if (p.reps === 2) p.interval = [0, 2, 4, 7][g];
      else p.interval = Math.max(p.interval + 1, Math.round(p.interval * [0, 1.2, p.ease, p.ease * 1.3][g]));
      if (g === 1) p.ease = Math.max(1.3, p.ease - 0.15);
      if (g === 3) p.ease = Math.min(3, p.ease + 0.15);
      p.due = Util.addDays(today, p.interval);
    }
    return p;
  }
  /* معاينة الفاصل الزمني لكل زر دون حفظ */
  const preview = (p, g, today) => { const r = grade(p || blank('x'), g, today); return r.interval; };
  const status = p => (!p || !p.first) ? 'new' : p.interval >= 21 ? 'mastered' : p.interval >= 3 ? 'reviewing' : 'learning';
  const isDue = (p, today) => !!(p && p.first && p.due && p.due <= today);
  const isHard = p => !!(p && p.first && (p.hardFlag || p.lapses >= 2 || (p.wrong >= 2 && p.wrong > p.correct)));
  const STATUS_AR = { new: 'جديد', learning: 'قيد التعلّم', reviewing: 'قيد المراجعة', mastered: 'متقن' };
  const intervalLabel = d => d <= 0 ? 'الآن' : d === 1 ? 'غداً' : d < 30 ? d + ' أيام' : Math.round(d / 30) + ' شهر';
  return { blank, grade, preview, status, isDue, isHard, STATUS_AR, intervalLabel };
})();

/* النطق: Web Speech API. يعمل دون إنترنت فقط إذا كان على الجهاز صوت إنجليزي محلي (localService). */
window.Speech = (function () {
  const synth = window.speechSynthesis || null;
  let voices = [], settings = { rate: 1, volume: 1, repeat: 1, voiceURI: '' }, token = 0;

  function load() {
    if (!synth) return;
    voices = synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
  }
  if (synth) { load(); synth.onvoiceschanged = load; }

  const supported = () => !!synth && typeof SpeechSynthesisUtterance !== 'undefined';
  const listVoices = () => { load(); return voices; };
  const hasLocalEnglish = () => listVoices().some(v => v.localService);
  function pick() {
    load();
    if (!voices.length) return null;
    const byUri = voices.find(v => v.voiceURI === settings.voiceURI);
    if (byUri) return byUri;
    const score = v => (v.localService ? 100 : 0) + (/en[-_]US/i.test(v.lang) ? 20 : /en[-_]GB/i.test(v.lang) ? 10 : 0) +
      (/Aria|Jenny|Zira|David|Samantha|Alex|Google US/i.test(v.name) ? 5 : 0);
    return voices.slice().sort((a, b) => score(b) - score(a))[0];
  }
  function configure(o) { Object.assign(settings, o); }

  /* opts.slow: بطيء للمبتدئين (نصف السرعة المختارة تقريباً بحد أدنى 0.5) */
  function say(text, opts) {
    opts = opts || {};
    if (!supported()) return Promise.resolve({ ok: false, reason: 'unsupported' });
    stop();
    const my = ++token, times = opts.once ? 1 : Math.max(1, settings.repeat | 0);
    const rate = opts.slow ? Math.max(0.5, Math.min(settings.rate, 1) * 0.6) : settings.rate;
    return new Promise(resolve => {
      let n = 0, started = false;
      const next = () => {
        if (my !== token) return resolve({ ok: true, cancelled: true });
        if (n >= times) return resolve({ ok: true, rate, voice: (pick() || {}).name || 'افتراضي' });
        n++;
        const u = new SpeechSynthesisUtterance(text), v = pick();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
        u.rate = Math.max(0.5, Math.min(1.5, rate)); u.volume = settings.volume;
        u.onstart = () => { started = true; };
        u.onend = () => setTimeout(next, 450);
        u.onerror = e => { if (e.error === 'interrupted' || e.error === 'canceled') return resolve({ ok: true, cancelled: true }); resolve({ ok: false, reason: e.error || 'error' }); };
        synth.speak(u);
      };
      next();
    });
  }
  function stop() { token++; if (synth) synth.cancel(); }
  return { supported, listVoices, hasLocalEnglish, configure, say, stop, pick };
})();

<script>
/* js/data.js */
/* استيراد/تصدير/نسخ احتياطي — كله محلي */
window.Data = (function () {
  const ARABIC_ONLY = /^[\u0600-\u06FF\s\-]+$/;
  const EN_OK = /^[A-Za-z0-9 \-'/().,&?]+$/;

  const arr = v => Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : String(v || '').split(';').map(x => x.trim()).filter(Boolean);
  function norm(o) {
    const en = String(o.en || o.term_en || o.term || '').trim().replace(/\s+/g, ' ');
    return {
      k: Util.normKey(en), en,
      pr: String(o.pr || o.pron || o.pron_ar || '').trim(), ar: String(o.ar || o.meaning || o.meaning_ar || '').trim(),
      sm: String(o.sm || o.simple || o.simple_ar || '').trim(), ex: String(o.ex || o.example_en || '').trim(),
      exa: String(o.exa || o.example_ar || '').trim(), c: String(o.c || o.cat || o.category || '').trim(),
      l: Number(o.l || o.level), p: String(o.p || o.pos || '').trim(), rt: String(o.rt || o.parts || o.root_part || '').trim(),
      rel: arr(o.rel || o.related || o.related_terms), df: String(o.df || o.difference || o.difference_note || '').trim()
    };
  }
  function validate(r) {
    const e = [];
    if (!r.en) e.push('المصطلح الإنجليزي فارغ'); else if (!EN_OK.test(r.en)) e.push('المصطلح يحتوي رموزاً غير مسموحة');
    if (!r.pr) e.push('النطق العربي فارغ'); else if (!ARABIC_ONLY.test(r.pr)) e.push('النطق يجب أن يكون بحروف عربية فقط');
    if (!r.ar) e.push('المعنى العربي فارغ');
    if (!r.sm) e.push('الشرح المبسط فارغ');
    if (!r.ex) e.push('المثال الإنجليزي فارغ');
    if (!r.exa) e.push('ترجمة المثال فارغة');
    if (!window.CATS[r.c]) e.push('التصنيف غير معروف: ' + (r.c || 'فارغ'));
    if (![1, 2, 3, 4].includes(r.l)) e.push('المستوى يجب أن يكون 1 إلى 4');
    return e;
  }

  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    const clean = rows.filter(r => r.some(c => c.trim() !== ''));
    if (clean.length < 2) return [];
    const head = clean[0].map(h => h.trim());
    return clean.slice(1).map(r => { const o = {}; head.forEach((h, i) => o[h] = r[i] === undefined ? '' : r[i]); return o; });
  }

  async function readFile(file) {
    const text = await file.text();
    if (/\.json$/i.test(file.name) || /^\s*[\[{]/.test(text)) {
      const j = JSON.parse(text);
      return Array.isArray(j) ? j : (j.terms || j.data || []);
    }
    return parseCSV(text);
  }

  /* معاينة قبل الاستيراد: لا يُكتب شيء في القاعدة هنا */
  function plan(rows) {
    const out = { valid: [], dupDb: [], dupFile: [], invalid: [], total: rows.length };
    const seen = new Set();
    rows.forEach((raw, i) => {
      const r = norm(raw), errs = validate(r);
      if (errs.length) { out.invalid.push({ line: i + 2, en: r.en || '(بدون اسم)', errs }); return; }
      if (App.S.map.has(r.k)) { out.dupDb.push({ line: i + 2, en: r.en }); return; }
      if (seen.has(r.k)) { out.dupFile.push({ line: i + 2, en: r.en }); return; }
      seen.add(r.k); out.valid.push(r);
    });
    return out;
  }
  async function commit(p, fileName) {
    let o = App.nextOrder(); p.valid.forEach(r => { r.o = o++; r.src = 'import'; });
    const res = await DB.addTerms(p.valid);
    await DB.put('imports', { at: Date.now(), file: fileName || '(يدوي)', total: p.total, added: res.added, dupDb: p.dupDb.length + res.dup, dupFile: p.dupFile.length, invalid: p.invalid.length });
    await App.reload();
    return res;
  }
  async function addOne(obj) {
    const r = norm(obj), errs = validate(r);
    if (errs.length) return { ok: false, errs };
    if (App.S.map.has(r.k)) return { ok: false, errs: ['هذا المصطلح موجود بالفعل: ' + r.en] };
    r.o = App.nextOrder(); r.src = 'manual';
    const res = await DB.addTerms([r]);
    if (!res.added) return { ok: false, errs: ['رفضت قاعدة البيانات الإضافة (مكرر)'] };
    await DB.put('imports', { at: Date.now(), file: '(إضافة يدوية)', total: 1, added: 1, dupDb: 0, dupFile: 0, invalid: 0 });
    await App.reload();
    return { ok: true, rec: r };
  }

  function download(name, text, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime || 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  /* ---- النسخة الاحتياطية ---- */
  async function backup() {
    const [terms, progress, quizzes, days] = await Promise.all(['terms', 'progress', 'quizzes', 'days'].map(DB.getAll));
    const payload = JSON.stringify({ terms, progress, quizzes, days, settings: App.S.set });
    const file = {
      app: 'nursing-terms', format: 1, exportedAt: new Date().toISOString(),
      counts: { terms: terms.length, progress: progress.length, quizzes: quizzes.length, days: days.length },
      checksum: Util.hash(payload), payload
    };
    download('nursing-backup-' + Util.today() + '.json', JSON.stringify(file));
    await DB.setMeta('lastBackup', Date.now());
    return file.counts;
  }

  async function readBackup(file) {
    let outer;
    try { outer = JSON.parse(await file.text()); } catch (e) { throw new Error('الملف ليس JSON صالحاً'); }
    if (!outer || outer.app !== 'nursing-terms') throw new Error('هذا ليس ملف نسخة احتياطية لهذا التطبيق');
    if (outer.format !== 1) throw new Error('إصدار النسخة غير مدعوم: ' + outer.format);
    if (typeof outer.payload !== 'string') throw new Error('محتوى النسخة مفقود');
    if (Util.hash(outer.payload) !== outer.checksum) throw new Error('الملف تالف أو تم تعديله (فشل فحص السلامة). لن تتم الاستعادة.');
    const d = JSON.parse(outer.payload);
    ['terms', 'progress', 'quizzes', 'days'].forEach(k => { if (!Array.isArray(d[k])) throw new Error('بنية النسخة غير صحيحة: ' + k); });
    const c = outer.counts || {};
    if (c.terms !== d.terms.length || c.progress !== d.progress.length) throw new Error('أعداد السجلات لا تطابق الملف');
    return { outer, d };
  }

  async function restore(file, opt) {
    opt = opt || {};
    const { d } = await readBackup(file);
    const rep = { termsAdded: 0, termsDup: 0, termsBad: 0, progNew: 0, progUpdated: 0, progKept: 0, progSkipped: 0, quizzes: 0, days: 0 };
    const good = [];
    d.terms.forEach(t => { const r = norm(t); if (validate(r).length) rep.termsBad++; else good.push(r); });
    const ar = await DB.addTerms(good); rep.termsAdded = ar.added; rep.termsDup = ar.dup;

    const have = new Set((await DB.getAll('terms')).map(t => t.k));
    const curProg = new Map((await DB.getAll('progress')).map(p => [p.k, p]));
    const toPut = [];
    d.progress.forEach(b => {
      if (!b || typeof b.k !== 'string' || !have.has(b.k)) { rep.progSkipped++; return; }
      const cur = curProg.get(b.k);
      if (!cur) { toPut.push(Object.assign(SRS.blank(b.k), b)); rep.progNew++; return; }
      if ((b.last || 0) > (cur.last || 0)) { const m = Object.assign(SRS.blank(b.k), b); m.fav = !!(cur.fav || b.fav); toPut.push(m); rep.progUpdated++; }
      else { if (b.fav && !cur.fav) { toPut.push(Object.assign({}, cur, { fav: true })); } rep.progKept++; }
    });
    await DB.putMany('progress', toPut);

    const qs = await DB.getAll('quizzes'), qk = new Set(qs.map(q => q.at + '|' + q.type + '|' + q.total + '|' + q.correct));
    const newQ = d.quizzes.filter(q => q && q.at && !qk.has(q.at + '|' + q.type + '|' + q.total + '|' + q.correct)).map(q => { const c = Object.assign({}, q); delete c.id; return c; });
    await DB.putMany('quizzes', newQ); rep.quizzes = newQ.length;

    const curDays = new Map((await DB.getAll('days')).map(x => [x.day, x]));
    const dayPut = [];
    d.days.forEach(b => {
      if (!b || !/^\d{4}-\d{2}-\d{2}$/.test(b.day)) return;
      const c = curDays.get(b.day) || { day: b.day, newTerms: 0, reviews: 0, correct: 0, wrong: 0 };
      dayPut.push({ day: b.day, newTerms: Math.max(c.newTerms || 0, b.newTerms || 0), reviews: Math.max(c.reviews || 0, b.reviews || 0), correct: Math.max(c.correct || 0, b.correct || 0), wrong: Math.max(c.wrong || 0, b.wrong || 0) });
    });
    await DB.putMany('days', dayPut); rep.days = dayPut.length;
    if (opt.settings && d.settings) await DB.setMeta('settings', Object.assign({}, App.S.set, d.settings));
    await App.reload();
    return rep;
  }

  async function exportTermsCSV() {
    const ts = await DB.getAll('terms');
    const cols = ['en', 'pr', 'ar', 'sm', 'ex', 'exa', 'c', 'l', 'p', 'rt', 'rel', 'df'];
    const q = v => '"' + String(Array.isArray(v) ? v.join(';') : (v == null ? '' : v)).replace(/"/g, '""') + '"';
    const lines = [cols.join(',')].concat(ts.map(t => cols.map(c => q(t[c])).join(',')));
    download('terms-' + Util.today() + '.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
    return ts.length;
  }

  return { norm, validate, parseCSV, readFile, plan, commit, addOne, backup, readBackup, restore, exportTermsCSV };
})();

</script>
<script>
/* js/ui1.js */
/* واجهة التطبيق — الجزء 1: الحالة والتوجيه والرئيسية وجلسة التعلّم */
window.V = {};
window.App = (function () {
  const DEF = { dailyNew: 10, rate: 1, volume: 1, repeat: 1, voiceURI: '', theme: 'auto', showPron: true, autoPlay: false, scopeCat: '', scopeLevel: 0, quizLen: 10 };
  const S = { terms: [], map: new Map(), prog: new Map(), days: new Map(), idx: new Map(), set: Object.assign({}, DEF) };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const en = t => '<span class="en" dir="ltr">' + Util.esc(t) + '</span>';
  const audio = (text, extra) => '<button class="ib" data-say="' + Util.esc(text) + '" title="استمع" aria-label="استمع">🔊</button><button class="ib" data-say="' + Util.esc(text) + '" data-slow="1" title="استمع ببطء" aria-label="استمع ببطء">🐢</button>' + (extra || '');

  function toast(msg, kind) {
    const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || '');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.className = '', 3200);
  }
  const getProg = k => S.prog.get(k) || SRS.blank(k);
  async function saveProg(p) { S.prog.set(p.k, p); await DB.put('progress', p); }
  async function bumpDay(d) {
    const day = Util.today(), r = S.days.get(day) || { day, newTerms: 0, reviews: 0, correct: 0, wrong: 0 };
    Object.keys(d).forEach(k => r[k] = (r[k] || 0) + d[k]);
    S.days.set(day, r); await DB.put('days', r);
  }
  const todayRec = () => S.days.get(Util.today()) || { newTerms: 0, reviews: 0, correct: 0, wrong: 0 };
  const nextOrder = () => S.terms.reduce((m, t) => Math.max(m, t.o == null ? -1 : t.o), -1) + 1;

  function applyTheme() {
    const th = S.set.theme; if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
  }
  async function reload() {
    const [terms, prog, days, set] = await Promise.all([DB.getAll('terms'), DB.getAll('progress'), DB.getAll('days'), DB.getMeta('settings', {})]);
    terms.sort((a, b) => (a.l - b.l) || ((a.o == null ? 1e9 : a.o) - (b.o == null ? 1e9 : b.o)) || (a.k < b.k ? -1 : 1));
    S.terms = terms; S.map = new Map(terms.map(t => [t.k, t]));
    S.prog = new Map(prog.map(p => [p.k, p])); S.days = new Map(days.map(d => [d.day, d]));
    S.idx = new Map(terms.map(t => [t.k, Util.normAr([t.en, t.pr, t.ar, t.sm, t.rt, (t.rel || []).join(' ')].join(' '))]));
    S.set = Object.assign({}, DEF, set);
    Speech.configure(S.set); applyTheme();
  }
  async function saveSettings(patch) { Object.assign(S.set, patch); Speech.configure(S.set); applyTheme(); await DB.setMeta('settings', S.set); }

  async function ensureSeed() {
    const v = await DB.getMeta('seedVersion', null);
    if (v === window.SEED_VERSION) return 0;
    const recs = window.SEED_TERMS.map((t, i) => ({ k: t.k, en: t.en, pr: t.pr, ar: t.ar, sm: t.sm, ex: t.ex, exa: t.exa, c: t.c, l: t.l, p: t.p, rt: t.rt, rel: t.rel, df: t.df, o: i, src: 'seed' }));
    const r = await DB.addTerms(recs);
    await DB.setMeta('seedVersion', window.SEED_VERSION);
    return r.added;
  }

  /* ----- نطاق الدراسة والخطة اليومية ----- */
  const scoped = () => S.terms.filter(t => (!S.set.scopeCat || t.c === S.set.scopeCat) && (!S.set.scopeLevel || t.l === S.set.scopeLevel));
  function plan(extra) {
    const td = Util.today(), sc = scoped();
    const due = sc.filter(t => SRS.isDue(S.prog.get(t.k), td)).sort((a, b) => {
      const pa = S.prog.get(a.k), pb = S.prog.get(b.k);
      return (SRS.isHard(pb) - SRS.isHard(pa)) || (pa.due < pb.due ? -1 : pa.due > pb.due ? 1 : 0);
    });
    const left = Math.max(0, S.set.dailyNew - todayRec().newTerms) + (extra || 0);
    const fresh = sc.filter(t => { const p = S.prog.get(t.k); return !p || !p.first; });
    return { due, fresh: fresh.slice(0, left), freshAvail: fresh.length, left };
  }

  /* ----- التوجيه ----- */
  const NAV = [['home', 'الرئيسية', '🏠', 1], ['learn', 'تعلّم', '🧠', 1], ['dict', 'القاموس', '📖', 1], ['quiz', 'اختبار', '✏️', 1], ['progress', 'تقدمي', '📊', 0], ['settings', 'الإعدادات', '⚙️', 0], ['data', 'البيانات', '💾', 0]];
  function buildNav() {
    $('#side').innerHTML = '<div class="brand">🩺 مصطلحات التمريض</div>' + NAV.map(n => '<a href="#/' + n[0] + '" data-nav="' + n[0] + '"><span>' + n[2] + '</span>' + n[1] + '</a>').join('');
    $('#bottom').innerHTML = NAV.filter(n => n[3]).map(n => '<a href="#/' + n[0] + '" data-nav="' + n[0] + '"><span>' + n[2] + '</span>' + n[1] + '</a>').join('') + '<a href="#/more" data-nav="more"><span>☰</span>المزيد</a>';
  }
  function route() {
    const h = (location.hash || '#/home').replace(/^#\/?/, ''), parts = h.split('/'), name = parts[0] || 'home';
    const args = parts.slice(1).map(decodeURIComponent);
    const main = $('#main'), fn = V[name] || V.home;
    const navName = ['session', 'term'].includes(name) ? (name === 'term' ? 'dict' : 'learn') : name;
    $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === navName || (navName === 'more' && false)));
    if (name !== 'session' && name !== 'quizrun') Speech.stop();
    main.scrollTop = 0; window.scrollTo(0, 0);
    try { fn(main, args); } catch (e) { main.innerHTML = '<div class="card err">حدث خطأ في عرض الصفحة: ' + Util.esc(e.message) + '</div>'; console.error(e); }
  }
  const go = h => { if (location.hash === h) route(); else location.hash = h; };

  async function boot() {
    buildNav();
    try { await DB.open(); } catch (e) {
      $('#main').innerHTML = '<div class="card err"><h2>تعذّر فتح قاعدة البيانات المحلية</h2><p>' + Util.esc(e.message) + '</p><p>جرّب فتح الملف بمتصفح Chrome أو Edge، وتأكد أنك لست في وضع التصفح الخفي.</p></div>'; return;
    }
    let added = 0;
    try { added = await ensureSeed(); await reload(); } catch (e) { $('#main').innerHTML = '<div class="card err">فشل تحميل البيانات: ' + Util.esc(e.message) + '</div>'; return; }
    window.addEventListener('hashchange', route);
    document.addEventListener('click', onSay);
    route();
    if (added) toast('تمت إضافة ' + Util.num(added) + ' مصطلح إلى قاعدتك المحلية', 'ok');
    DB.requestPersist();
    window.__appReady = true;
  }
  async function onSay(e) {
    const b = e.target.closest('[data-say]'); if (!b) return;
    if (!Speech.supported()) return toast('هذا المتصفح لا يدعم النطق الصوتي', 'bad');
    if (!Speech.listVoices().length) toast('لا توجد أصوات إنجليزية مثبتة على هذا الجهاز — راجع الإعدادات ← الصوت', 'bad');
    b.classList.add('playing');
    const r = await Speech.say(b.dataset.say, { slow: !!b.dataset.slow });
    b.classList.remove('playing');
    if (r && r.ok === false) toast('تعذّر تشغيل الصوت (' + (r.reason || 'خطأ') + ')', 'bad');
  }
  return { S, $, $$, en, audio, toast, getProg, saveProg, bumpDay, todayRec, nextOrder, reload, saveSettings, plan, scoped, go, boot, route };
})();

/* ================= الرئيسية ================= */
V.home = function (root) {
  const { S, plan, todayRec } = App, p = plan(0), td = todayRec();
  const prog = Array.from(S.prog.values()).filter(x => x.first);
  const mastered = prog.filter(x => SRS.status(x) === 'mastered').length, hard = prog.filter(SRS.isHard).length;
  const total = S.terms.length, learned = prog.length;
  const goal = S.set.dailyNew + p.due.length + td.newTerms; // تقدير الهدف اليوم
  const done = td.newTerms + Math.min(td.reviews, p.due.length + td.reviews);
  root.innerHTML = `

  <div class="card hero">
    <h2>خطة اليوم</h2>
    <div class="plan"><div><b>${Util.num(p.due.length)}</b><small>مراجعة مستحقة</small></div><div><b>${Util.num(p.fresh.length)}</b><small>مصطلح جديد</small></div><div><b>${Util.num(td.reviews)}</b><small>تمت اليوم</small></div></div>
    <button class="btn big" data-go="#/learn">${(p.due.length + p.fresh.length) ? 'ابدأ التعلّم الآن' : 'أحسنت! لا شيء مستحق — افتح صفحة التعلّم'}</button>

  <div class="grid2">
    <a class="card link" href="#/dict">📖 القاموس والبحث</a><a class="card link" href="#/quiz">✏️ اختبر نفسك</a>

V.more = function (root) {

  <a class="card link" href="#/progress">📊 تقدمي وإحصائياتي</a><a class="card link" href="#/dict/fav">⭐ المفضلة</a>
  <a class="card link" href="#/dict/hard">🔥 الكلمات الصعبة</a><a class="card link" href="#/settings">⚙️ الإعدادات والصوت</a>

};

/* ================= التعلّم (جلسات البطاقات) ================= */
let Sess = null;
V.learn = function (root) {
  const { S, plan } = App, p = plan(0), sc = App.scoped();
  const hardList = sc.filter(t => SRS.isHard(S.prog.get(t.k))), favList = S.terms.filter(t => (S.prog.get(t.k) || {}).fav);
  const catOpts = '<option value="">كل التصنيفات</option>' + Object.keys(CATS).map(k => `<option value="${k}" ${S.set.scopeCat === k ? 'selected' : ''}>${CATS[k].i} ${CATS[k].ar}</option>`).join('');
  const lvOpts = '<option value="0">كل المستويات</option>' + [1, 2, 3, 4].map(l => `<option value="${l}" ${S.set.scopeLevel === l ? 'selected' : ''}>${LEVELS[l]}</option>`).join('');
  root.innerHTML = `<h1>تعلّم</h1>
  <div class="card"><h3>نطاق الدراسة</h3><div class="row"><select id="sc-cat">${catOpts}</select><select id="sc-lv">${lvOpts}</select></div>
  <p class="muted small">المصطلحات في النطاق: ${Util.num(sc.length)} — جديدة غير مدروسة: ${Util.num(p.freshAvail)}</p></div>
  <div class="card"><h3>جلسة اليوم</h3><p>${Util.num(p.due.length)} مراجعة مستحقة + ${Util.num(p.fresh.length)} مصطلح جديد (الهدف اليومي ${Util.num(S.set.dailyNew)}، غيّره من الإعدادات)</p>
  <div class="row"><button class="btn big" id="b-today" ${p.due.length + p.fresh.length ? '' : 'disabled'}>ابدأ جلسة اليوم</button><button class="btn alt" id="b-extra" ${p.freshAvail > p.fresh.length ? '' : 'disabled'}>+5 مصطلحات جديدة</button></div></div>
  <div class="card"><h3>تدريب خاص</h3><div class="row"><button class="btn alt" id="b-hard" ${hardList.length ? '' : 'disabled'}>🔥 الصعبة (${Util.num(hardList.length)})</button><button class="btn alt" id="b-fav" ${favList.length ? '' : 'disabled'}>⭐ المفضلة (${Util.num(favList.length)})</button></div></div>`;
  const save = async () => { await App.saveSettings({ scopeCat: App.$('#sc-cat').value, scopeLevel: Number(App.$('#sc-lv').value) }); V.learn(root); };
  App.$('#sc-cat').onchange = save; App.$('#sc-lv').onchange = save;
  const start = (list, title) => { Sess = { queue: list.slice(), total: list.length, done: 0, retry: {}, st: { n: 0, c: 0, w: 0 }, flipped: false, title }; App.go('#/session'); };
  App.$('#b-today').onclick = () => start(p.due.concat(p.fresh), 'جلسة اليوم');
  App.$('#b-extra').onclick = () => { const q = plan(5); start(q.due.concat(q.fresh), 'جلسة اليوم + جديد إضافي'); };
  App.$('#b-hard').onclick = () => start(Util.shuffle(hardList), 'الكلمات الصعبة');
  App.$('#b-fav').onclick = () => start(Util.shuffle(favList), 'المفضلة');
};

V.session = function (root) {
  if (!Sess) return App.go('#/learn');
  if (!Sess.queue.length) return summary(root);
  const t = Sess.queue[0], p = App.getProg(t.k), td = Util.today(), S = App.S;
  const pct = Util.pct(Sess.done, Sess.done + Sess.queue.length);
  const isNew = !p.first;
  const front = `<div class="fc-top"><span class="chip ${isNew ? 'new' : ''}">${isNew ? 'جديد' : SRS.STATUS_AR[SRS.status(p)]}</span><span class="muted small">${CATS[t.c].i} ${CATS[t.c].ar}</span></div>
    <div class="fc-term">${App.en(t.en)}</div>${S.set.showPron ? '<div class="pron">' + Util.esc(t.pr) + '</div>' : ''}
    <div class="row c">${App.audio(t.en)}</div>`;
  const back = `<hr><div class="fc-mean">${Util.esc(t.ar)}</div><p>${Util.esc(t.sm)}</p>
    <div class="ex"><div>${App.en(t.ex)} ${App.audio(t.ex)}</div><div class="muted">${Util.esc(t.exa)}</div></div>
    ${t.rt ? '<p class="small">🧩 الجذر/الأجزاء: ' + App.en(t.rt) + '</p>' : ''}${t.df ? '<p class="small warnt">⚠️ ' + Util.esc(t.df) + '</p>' : ''}`;
  const labels = [['نسيته', 'bad', 0], ['صعب', 'alt', 1], ['جيد', 'ok', 2], ['سهل', 'ok2', 3]];
  root.innerHTML = `<div class="sess-h"><button class="btn sm alt" id="s-exit">إنهاء</button><b>${Util.esc(Sess.title)}</b><span class="muted small">${Util.num(Sess.queue.length)} متبقية</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card fc" id="fc">${front}${Sess.flipped ? back : '<div class="row c"><button class="btn big" id="s-flip">إظهار المعنى</button></div><p class="muted small c">اختصارات: مسافة = إظهار، P = صوت، 1-4 = التقييم</p>'}</div>
  ${Sess.flipped ? '<div class="grades">' + labels.map(l => `<button class="btn ${l[1]}" data-g="${l[2]}">${l[0]}<small>${SRS.intervalLabel(SRS.preview(p, l[2], td))}</small></button>`).join('') + '</div>' : ''}`;
  App.$('#s-exit').onclick = () => { Speech.stop(); Sess.queue = []; V.session(root); };
  const flip = () => { Sess.flipped = true; V.session(root); };
  const fb = App.$('#s-flip'); if (fb) fb.onclick = flip;
  App.$$('[data-g]').forEach(b => b.onclick = () => grade(root, Number(b.dataset.g)));
  if (!Sess.flipped && S.set.autoPlay) Speech.say(t.en, { once: false });
  Sess.key = e => {
    if (location.hash !== '#/session' || /INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName)) return;
    if (e.key === ' ' && !Sess.flipped) { e.preventDefault(); flip(); }
    else if (/^[1-4]$/.test(e.key) && Sess.flipped) grade(root, Number(e.key) - 1);
    else if (e.key.toLowerCase() === 'p') Speech.say(t.en);
  };
  document.onkeydown = Sess.key;
};
async function grade(root, g) {
  if (Sess.busy) return; Sess.busy = true;
  const t = Sess.queue.shift(), p0 = App.getProg(t.k), isNew = !p0.first;
  await App.saveProg(SRS.grade(p0, g, Util.today()));
  await App.bumpDay({ newTerms: isNew ? 1 : 0, reviews: 1, correct: g > 0 ? 1 : 0, wrong: g === 0 ? 1 : 0 });
  Sess.st.n++; g > 0 ? Sess.st.c++ : Sess.st.w++;
  if (g === 0 && (Sess.retry[t.k] || 0) < 2) { Sess.retry[t.k] = (Sess.retry[t.k] || 0) + 1; Sess.queue.push(t); } else Sess.done++;
  Sess.flipped = false; Sess.busy = false; V.session(root);
}
function summary(root) {
  document.onkeydown = null;
  const st = Sess.st; const s = Sess; Sess = null;
  root.innerHTML = `<div class="card c"><div style="font-size:3rem">🎉</div><h2>انتهت الجلسة</h2>
  <div class="tiles"><div class="tile"><b>${Util.num(st.n)}</b><small>إجابات</small></div><div class="tile ok"><b>${Util.num(st.c)}</b><small>تذكّرتها</small></div><div class="tile bad"><b>${Util.num(st.w)}</b><small>نسيتها</small></div></div>
  <p class="muted">المصطلحات التي نسيتها ستعود إليك أكثر تكراراً حتى تتقنها.</p>
  <div class="row c"><button class="btn big" id="s-again">جلسة جديدة</button><a class="btn alt" href="#/home">الرئيسية</a></div></div>`;
  App.$('#s-again').onclick = () => App.go('#/learn');
}

</script>
<script>
/* js/ui2.js */
/* واجهة التطبيق — الجزء 2: القاموس وتفاصيل المصطلح والاختبارات */
const DF = { q: '', cat: '', lv: 0, st: 'all', page: 1 };
const PAGE = 40;
const ST_OPTS = [['all', 'الكل'], ['new', 'جديدة'], ['learning', 'قيد التعلّم'], ['reviewing', 'قيد المراجعة'], ['mastered', 'متقنة'], ['fav', '⭐ المفضلة'], ['hard', '🔥 الصعبة']];

function dictFilter() {
  const { S } = App, q = Util.normAr(DF.q.trim());
  return S.terms.filter(t => {
    if (DF.cat && t.c !== DF.cat) return false;
    if (DF.lv && t.l !== DF.lv) return false;
    const p = S.prog.get(t.k);
    if (DF.st === 'fav' && !(p && p.fav)) return false;
    if (DF.st === 'hard' && !SRS.isHard(p)) return false;
    if (['new', 'learning', 'reviewing', 'mastered'].includes(DF.st) && SRS.status(p) !== DF.st) return false;
    return !q || S.idx.get(t.k).includes(q);
  });
}
function dictRow(t) {
  const p = App.S.prog.get(t.k), st = SRS.status(p);
  return `<a class="li" href="#/term/${encodeURIComponent(t.k)}"><div class="li-main"><div>${App.en(t.en)} <span class="pron sm">${Util.esc(t.pr)}</span></div><div class="muted">${Util.esc(t.ar)}</div></div>
  <div class="li-side">${p && p.fav ? '<span title="مفضلة">⭐</span>' : ''}${SRS.isHard(p) ? '<span title="صعبة">🔥</span>' : ''}<span class="chip ${st}">${SRS.STATUS_AR[st]}</span></div></a>`;
}
V.dict = function (root, args) {
  if (args[0] === 'fav' || args[0] === 'hard') { DF.st = args[0]; DF.page = 1; DF.q = ''; DF.cat = ''; DF.lv = 0; }
  const { S } = App;
  const catOpts = '<option value="">كل التصنيفات</option>' + Object.keys(CATS).map(k => `<option value="${k}" ${DF.cat === k ? 'selected' : ''}>${CATS[k].i} ${CATS[k].ar}</option>`).join('');
  const lvOpts = '<option value="0">كل المستويات</option>' + [1, 2, 3, 4].map(l => `<option value="${l}" ${DF.lv === l ? 'selected' : ''}>${LEVELS[l]}</option>`).join('');
  const stOpts = ST_OPTS.map(o => `<option value="${o[0]}" ${DF.st === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('');
  root.innerHTML = `<h1>القاموس</h1>
  <input id="d-q" type="search" placeholder="ابحث بالإنجليزي أو العربي أو النطق أو جزء من الكلمة…" value="${Util.esc(DF.q)}" autocomplete="off">
  <div class="row"><select id="d-cat">${catOpts}</select><select id="d-lv">${lvOpts}</select><select id="d-st">${stOpts}</select></div>
  <p class="muted small" id="d-count"></p><div id="d-list" class="list"></div><div class="row c"><button class="btn alt" id="d-more" style="display:none">عرض المزيد</button></div>`;
  const draw = () => {
    const list = dictFilter(), shown = list.slice(0, DF.page * PAGE);
    App.$('#d-count').textContent = 'النتائج: ' + Util.num(list.length) + ' من ' + Util.num(S.terms.length);
    App.$('#d-list').innerHTML = shown.length ? shown.map(dictRow).join('') : '<div class="card muted c">لا توجد نتائج مطابقة. جرّب كلمة أخرى أو غيّر الفلاتر.</div>';
    App.$('#d-more').style.display = list.length > shown.length ? '' : 'none';
  };
  const q = App.$('#d-q');
  q.oninput = Util.debounce(() => { DF.q = q.value; DF.page = 1; draw(); }, 120);
  App.$('#d-cat').onchange = e => { DF.cat = e.target.value; DF.page = 1; draw(); };
  App.$('#d-lv').onchange = e => { DF.lv = Number(e.target.value); DF.page = 1; draw(); };
  App.$('#d-st').onchange = e => { DF.st = e.target.value; DF.page = 1; draw(); };
  App.$('#d-more').onclick = () => { DF.page++; draw(); };
  draw();
};

V.term = function (root, args) {
  const { S } = App, t = S.map.get(args[0]);
  if (!t) { root.innerHTML = '<div class="card err">المصطلح غير موجود.</div><a class="btn" href="#/dict">رجوع للقاموس</a>'; return; }
  const p = App.getProg(t.k), st = SRS.status(p);
  const rel = (t.rel || []).map(r => { const k = Util.normKey(r); return S.map.has(k) ? `<a class="chip link" href="#/term/${encodeURIComponent(k)}">${Util.esc(S.map.get(k).en)}</a>` : `<span class="chip">${Util.esc(r)}</span>`; }).join(' ');
  root.innerHTML = `<a class="back" href="javascript:history.back()">→ رجوع</a>
  <div class="card"><div class="fc-top"><span class="chip">${CATS[t.c].i} ${CATS[t.c].ar}</span><span class="chip">${LEVELS[t.l]}</span><span class="chip">${POS_AR[t.p] || Util.esc(t.p)}</span></div>
  <div class="c"><div class="fc-term">${App.en(t.en)}</div><div class="pron">${Util.esc(t.pr)}</div><div class="row c">${App.audio(t.en)}</div>
  <hr><div class="fc-mean">${Util.esc(t.ar)}</div></div><p>${Util.esc(t.sm)}</p>
  <div class="ex"><div>${App.en(t.ex)} ${App.audio(t.ex)}</div><div class="muted">${Util.esc(t.exa)}</div></div>
  ${t.rt ? '<p>🧩 الجذر/الأجزاء: ' + App.en(t.rt) + '</p>' : ''}${t.df ? '<p class="warnt">⚠️ ' + Util.esc(t.df) + '</p>' : ''}
  ${rel ? '<p><b>مصطلحات مرتبطة:</b> ' + rel + '</p>' : ''}
  <p class="small muted">النطق بالحروف العربية وسيلة مساعدة تقريبية، والأصل هو الصوت.</p></div>
  <div class="card"><h3>تقدّمك</h3><p>الحالة: <span class="chip ${st}">${SRS.STATUS_AR[st]}</span> — صحيح ${Util.num(p.correct)} / خطأ ${Util.num(p.wrong)}${p.first ? ' — المراجعة القادمة: ' + (p.due <= Util.today() ? 'الآن' : p.due) : ''}</p>
  <div class="row"><button class="btn alt" id="t-fav">${p.fav ? '⭐ إزالة من المفضلة' : '☆ أضف للمفضلة'}</button><button class="btn alt" id="t-hard">${p.hardFlag ? '🔥 إلغاء علامة الصعوبة' : '🔥 علّمها كصعبة'}</button></div></div>`;
  App.$('#t-fav').onclick = async () => { await App.saveProg(Object.assign({}, p, { fav: !p.fav })); V.term(root, args); };
  App.$('#t-hard').onclick = async () => { await App.saveProg(Object.assign({}, p, { hardFlag: !p.hardFlag })); V.term(root, args); };
};

/* ================= الاختبارات ================= */
let QR = null;
const QTYPES = [['meaning', '🔤 المعنى', 'يظهر المصطلح الإنجليزي واختر معناه بالعربي'], ['reverse', '🔁 العكس', 'يظهر المعنى العربي واختر المصطلح الإنجليزي'],
['listen', '👂 الاستماع', 'اسمع النطق واختر المصطلح الصحيح'], ['spell', '⌨️ الإملاء', 'يظهر المعنى واكتب المصطلح بالإنجليزية']];

V.quiz = async function (root) {
  const { S } = App;
  const catOpts = '<option value="">كل التصنيفات</option>' + Object.keys(CATS).map(k => `<option value="${k}">${CATS[k].i} ${CATS[k].ar}</option>`).join('');
  root.innerHTML = `<h1>اختبر نفسك</h1><div class="card"><h3>نوع الاختبار</h3><div class="grid2" id="q-types">${QTYPES.map((q, i) => `<label class="opt-card"><input type="radio" name="qt" value="${q[0]}" ${i === 0 ? 'checked' : ''}><b>${q[1]}</b><small>${q[2]}</small></label>`).join('')}</div>
  <div class="row"><select id="q-cat">${catOpts}</select><select id="q-len">${[10, 20, 30].map(n => `<option value="${n}" ${S.set.quizLen === n ? 'selected' : ''}>${n} أسئلة</option>`).join('')}</select></div>
  <button class="btn big" id="q-start">ابدأ الاختبار</button><p class="muted small">تُعطى الكلمات الصعبة والمستحقة للمراجعة أولوية أكبر في الأسئلة.</p></div><div id="q-hist"></div>`;
  App.$('#q-start').onclick = () => {
    const type = document.querySelector('input[name=qt]:checked').value, cat = App.$('#q-cat').value, len = Number(App.$('#q-len').value);
    App.saveSettings({ quizLen: len });
    const td = Util.today();
    const pool = S.terms.filter(t => !cat || t.c === cat).map(t => { const p = S.prog.get(t.k); const w = SRS.isHard(p) ? 3 : SRS.isDue(p, td) ? 2 : (p && p.first) ? 1.5 : 1; return { t, s: Math.random() * w }; }).sort((a, b) => b.s - a.s).slice(0, len).map(x => x.t);
    if (pool.length < 4) return App.toast('عدد المصطلحات في هذا التصنيف قليل لإنشاء اختبار', 'bad');
    startQuiz(type, pool);
  };
  const h = (await DB.getAll('quizzes')).sort((a, b) => b.at - a.at).slice(0, 8);
  App.$('#q-hist').innerHTML = h.length ? '<div class="card"><h3>آخر الاختبارات</h3>' + h.map(q => `<div class="li static"><span>${new Date(q.at).toLocaleDateString('ar-EG')} — ${(QTYPES.find(x => x[0] === q.type) || [0, q.type])[1]}</span><b>${Util.num(q.correct)}/${Util.num(q.total)} (${Util.pct(q.correct, q.total)}%)</b></div>`).join('') + '</div>' : '';
};

function startQuiz(type, pool) {
  QR = { type, list: pool, i: 0, ok: 0, items: [], answered: false };
  App.go('#/quizrun');
}
function distractors(t, n, key) {
  const same = App.S.terms.filter(x => x.k !== t.k && x.c === t.c), other = App.S.terms.filter(x => x.k !== t.k && x.c !== t.c);
  const seen = new Set([t[key]]), out = [];
  for (const x of Util.shuffle(same).concat(Util.shuffle(other))) { if (out.length >= n) break; if (seen.has(x[key])) continue; seen.add(x[key]); out.push(x); }
  return out;
}
V.quizrun = function (root) {
  if (!QR) return App.go('#/quiz');
  if (QR.i >= QR.list.length) return quizResult(root);
  const t = QR.list[QR.i], type = QR.type; QR.answered = false;
  let prompt = '', body = '';
  const opts = (key, fmt) => { QR.opts = Util.shuffle([t].concat(distractors(t, 3, key))); return '<div class="opts">' + QR.opts.map((o, i) => `<button class="opt" data-i="${i}">${fmt(o)}</button>`).join('') + '</div>'; };
  if (type === 'meaning') { prompt = `<div class="fc-term">${App.en(t.en)}</div><div class="pron">${Util.esc(t.pr)}</div><div class="row c">${App.audio(t.en)}</div><p class="c muted">ما معناه؟</p>`; body = opts('ar', o => Util.esc(o.ar)); }
  else if (type === 'reverse') { prompt = `<div class="fc-mean">${Util.esc(t.ar)}</div><p class="c muted">ما المصطلح الإنجليزي؟</p>`; body = opts('en', o => App.en(o.en) + '<small>' + Util.esc(o.pr) + '</small>'); }
  else if (type === 'listen') { prompt = `<div class="row c"><button class="btn big" data-say="${Util.esc(t.en)}">🔊 اسمع</button><button class="btn alt" data-say="${Util.esc(t.en)}" data-slow="1">🐢 ببطء</button></div><p class="c muted">اسمع ثم اختر المصطلح الصحيح</p>`; body = opts('en', o => App.en(o.en)); }
  else { prompt = `<div class="fc-mean">${Util.esc(t.ar)}</div><div class="pron">${Util.esc(t.pr)}</div><div class="row c">${App.audio(t.en)}</div><p class="c muted">اكتب المصطلح بالإنجليزية</p>`; body = '<input id="q-in" class="spell" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here…"><div class="row c"><button class="btn big" id="q-check">تحقق</button></div>'; }
  root.innerHTML = `<div class="sess-h"><button class="btn sm alt" id="q-exit">إنهاء</button><b>السؤال ${Util.num(QR.i + 1)} من ${Util.num(QR.list.length)}</b><span class="chip ok">${Util.num(QR.ok)} صحيح</span></div>
  <div class="bar"><i style="width:${Util.pct(QR.i, QR.list.length)}%"></i></div><div class="card">${prompt}${body}<div id="q-fb"></div></div>`;
  App.$('#q-exit').onclick = () => { Speech.stop(); QR.list = QR.list.slice(0, QR.i); quizResult(root); };
  if (type === 'listen' && App.S.set.autoPlay !== false && Speech.supported()) setTimeout(() => Speech.say(t.en), 250);
  if (type === 'spell') { const inp = App.$('#q-in'); inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') answer(root, inp.value); }; App.$('#q-check').onclick = () => answer(root, inp.value); }
  else App.$$('.opt').forEach(b => b.onclick = () => answer(root, QR.opts[Number(b.dataset.i)].k, b));
};
async function answer(root, given, btn) {
  if (QR.answered) return; if (QR.type === 'spell' && !String(given).trim()) return; QR.answered = true;
  const t = QR.list[QR.i], ok = QR.type === 'spell' ? Util.normKey(given) === t.k : given === t.k;
  QR.items.push([t.k, ok ? 1 : 0]); if (ok) QR.ok++;
  App.$$('.opt').forEach((b, i) => { b.disabled = true; if (QR.opts[i].k === t.k) b.classList.add('right'); });
  if (btn && !ok) btn.classList.add('wrong');
  if (QR.type === 'spell') { const inp = App.$('#q-in'); inp.disabled = true; inp.classList.add(ok ? 'right' : 'wrong'); App.$('#q-check').style.display = 'none'; }
  App.$('#q-fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? '✅ إجابة صحيحة' : '❌ إجابة خاطئة'}</b><div>الصحيح: ${App.en(t.en)} — ${Util.esc(t.ar)} <span class="pron sm">${Util.esc(t.pr)}</span> ${App.audio(t.en)}</div><div class="muted">${Util.esc(t.sm)}</div></div><div class="row c"><button class="btn big" id="q-next">${QR.i + 1 >= QR.list.length ? 'عرض النتيجة' : 'التالي ←'}</button></div>`;
  App.$('#q-next').onclick = () => { QR.i++; V.quizrun(root); }; App.$('#q-next').focus();
  /* تحديث التقدّم: الخطأ في كلمة مدروسة يعيدها للمراجعة اليوم */
  const p = App.getProg(t.k); let np;
  if (ok) np = (p.first && SRS.isDue(p, Util.today())) ? SRS.grade(p, 2, Util.today()) : Object.assign({}, p, { correct: p.correct + 1 });
  else np = p.first ? Object.assign({}, p, { wrong: p.wrong + 1, lapses: p.lapses + 1, ease: Math.max(1.3, p.ease - 0.1), due: Util.today(), last: Date.now() }) : Object.assign({}, p, { wrong: p.wrong + 1 });
  await App.saveProg(np);
  await App.bumpDay({ reviews: 1, correct: ok ? 1 : 0, wrong: ok ? 0 : 1 });
}
async function quizResult(root) {
  const total = QR.items.length, ok = QR.ok, pct = Util.pct(ok, total), q = QR; QR = null;
  if (total) await DB.put('quizzes', { at: Date.now(), type: q.type, total, correct: ok, items: q.items });
  const wrong = q.items.filter(x => !x[1]).map(x => App.S.map.get(x[0])).filter(Boolean);
  root.innerHTML = `<div class="card c"><div style="font-size:3rem">${pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪'}</div><h2>النتيجة: ${Util.num(ok)} من ${Util.num(total)} (${Util.num(pct)}%)</h2>
  <p class="muted">${pct >= 80 ? 'ممتاز! استمر.' : pct >= 50 ? 'جيد، راجع الأخطاء.' : 'لا بأس، التكرار هو سر الحفظ.'}</p>
  ${wrong.length ? '<h3>مصطلحات أخطأت فيها</h3><div class="list">' + wrong.map(dictRow).join('') + '</div><div class="row c"><button class="btn big" id="q-retry">أعد اختبار الأخطاء</button></div>' : ''}
  <div class="row c"><a class="btn alt" href="#/quiz">اختبار جديد</a></div></div>`;
  const r = App.$('#q-retry'); if (r) r.onclick = () => startQuiz(q.type, wrong.length >= 4 ? wrong : wrong.concat(distractors(wrong[0], 4 - wrong.length, 'k')));
}

V.progress = async function (root) {
  const { S } = App, td = Util.today();
  const prog = Array.from(S.prog.values()).filter(p => p.first);
  const cnt = { learning: 0, reviewing: 0, mastered: 0 }; prog.forEach(p => cnt[SRS.status(p)]++);
  const due = prog.filter(p => SRS.isDue(p, td)).length, hard = prog.filter(SRS.isHard).length;
  const days = Array.from(S.days.values()), sum = (arr, f) => arr.reduce((a, d) => a + (d[f] || 0), 0);
  const active = d => (d.reviews || 0) + (d.newTerms || 0) > 0;
  const acc = (arr) => { const c = sum(arr, 'correct'), w = sum(arr, 'wrong'); return (c + w) ? Util.pct(c, c + w) + '%' : '—'; };
  let streak = 0, d = td; if (!(S.days.get(d) && active(S.days.get(d)))) d = Util.addDays(d, -1);
  while (S.days.get(d) && active(S.days.get(d))) { streak++; d = Util.addDays(d, -1); }
  const last = n => Array.from({ length: n }, (_, i) => Util.addDays(td, -(n - 1 - i))).map(x => S.days.get(x) || { day: x, newTerms: 0, reviews: 0, correct: 0, wrong: 0 });
  const l14 = last(14), mx = Math.max(1, ...l14.map(x => x.reviews || 0));
  const l7 = last(7).filter(active), l30 = last(30).filter(active);
  const rep = (title, a) => `<div class="tile"><small>${title}</small><b>${Util.num(a.length)}</b><small>يوم دراسة</small><small>${Util.num(sum(a, 'newTerms'))} جديد · ${Util.num(sum(a, 'reviews'))} مراجعة · دقة ${acc(a)}</small></div>`;
  const cats = Object.keys(CATS).map(k => { const all = S.terms.filter(t => t.c === k), st = all.filter(t => (S.prog.get(t.k) || {}).first).length; return `<div class="cp"><span>${CATS[k].i} ${CATS[k].ar}</span><div class="bar sm"><i style="width:${Util.pct(st, all.length)}%"></i></div><small>${Util.num(st)}/${Util.num(all.length)}</small></div>`; }).join('');
  const qz = (await DB.getAll('quizzes')).sort((a, b) => b.at - a.at).slice(0, 10);
  root.innerHTML = `<h1>تقدّمي</h1>
  <div class="tiles"><div class="tile"><b>${Util.num(prog.length)}</b><small>بدأت تعلّمها</small></div><div class="tile ok"><b>${Util.num(cnt.mastered)}</b><small>متقنة</small></div><div class="tile"><b>${Util.num(due)}</b><small>مستحقة للمراجعة</small></div><div class="tile bad"><b>${Util.num(hard)}</b><small>صعبة</small></div>
  <div class="tile"><b>${Util.num(streak)}</b><small>أيام متتالية 🔥</small></div><div class="tile"><b>${acc(days)}</b><small>دقة الإجابات</small></div><div class="tile"><b>${qz.length ? Util.pct(qz.reduce((a, q) => a + q.correct, 0), qz.reduce((a, q) => a + q.total, 0)) + '%' : '—'}</b><small>متوسط آخر الاختبارات</small></div><div class="tile"><b>${Util.num(S.terms.length - prog.length)}</b><small>لم تبدأها بعد</small></div></div>
  <div class="card"><h3>آخر 14 يوماً (عدد المراجعات)</h3><div class="chart">${l14.map(x => `<div class="col" title="${x.day}: ${x.reviews || 0}"><i style="height:${Math.max(2, Util.pct(x.reviews || 0, mx))}%"></i><small>${x.day.slice(8)}</small></div>`).join('')}</div></div>
  <div class="card"><h3>التقارير</h3><div class="tiles">${rep('هذا الأسبوع', l7)}${rep('آخر 30 يوماً', l30)}</div></div>

  <div class="card"><h3>سجل أيام الدراسة</h3>${days.filter(active).sort((a, b) => a.day < b.day ? 1 : -1).slice(0, 30).map(x => `<div class="li static"><span>${x.day}</span><span>${Util.num(x.newTerms)} جديد · ${Util.num(x.reviews)} مراجعة · ✅${Util.num(x.correct)} ❌${Util.num(x.wrong)}</span></div>`).join('') || '<p class="muted">لا توجد أيام دراسة مسجلة بعد. ابدأ جلسة تعلّم!</p>'}</div>`;
};

  ${imps.length ? '<div class="card"><h3>سجل الاستيراد</h3>' + imps.map(i => `<div class="li static"><span>${new Date(i.at).toLocaleString('ar-EG')} — ${Util.esc(i.file)}</span><span>+${Util.num(i.added)} · مكرر ${Util.num(i.dupDb + i.dupFile)} · أخطاء ${Util.num(i.invalid)}</span></div>`).join('') + '</div>' : ''}`;
  const $ = App.$;
  $('#d-backup').onclick = async () => { try { const c = await Data.backup(); App.toast('تم التصدير: ' + Util.num(c.terms) + ' مصطلح و' + Util.num(c.progress) + ' سجل تقدّم', 'ok'); } catch (e) { App.toast('فشل التصدير: ' + e.message, 'bad'); } };
  $('#d-csv').onclick = async () => App.toast('تم تصدير ' + Util.num(await Data.exportTermsCSV()) + ' مصطلح', 'ok');
  $('#d-tpl').onclick = () => { const h = 'en,pr,ar,sm,ex,exa,c,l,p,rt,rel,df\r\n', r = '"Example term","إجزامبل ترم","مثال","شرح مبسط","This is an example.","هذا مثال.","basics","1","noun","","patient;nurse",""\r\n'; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + h + r], { type: 'text/csv' })); a.download = 'terms-template.csv'; a.click(); };
  $('#d-restore').onchange = async e => {
    const file = e.target.files[0]; if (!file) return; const out = $('#d-rres');
    try {
      const { outer } = await Data.readBackup(file);
      if (!confirm('ملف سليم ✔ (' + outer.counts.terms + ' مصطلح، ' + outer.counts.progress + ' سجل تقدّم). سيتم دمجه مع بياناتك الحالية. متابعة؟')) { out.innerHTML = ''; return; }
      const r = await Data.restore(file, { settings: $('#d-rset').checked });
      out.innerHTML = `<div class="fb ok"><b>✅ تمت الاستعادة</b><div>مصطلحات جديدة: ${Util.num(r.termsAdded)} · مكررة تم تجاهلها: ${Util.num(r.termsDup)} · غير صالحة: ${Util.num(r.termsBad)}</div><div>تقدّم: جديد ${Util.num(r.progNew)} · محدّث ${Util.num(r.progUpdated)} · أبقيت الأحدث ${Util.num(r.progKept)} · متجاهل ${Util.num(r.progSkipped)}</div><div>اختبارات مضافة: ${Util.num(r.quizzes)} · أيام: ${Util.num(r.days)}</div></div>`;
    } catch (err) { out.innerHTML = '<div class="fb bad">❌ ' + Util.esc(err.message) + '</div>'; }
    e.target.value = '';
  };
  $('#d-file').onchange = async e => {
    const file = e.target.files[0]; if (!file) return; const box = $('#d-prev');
    try {
      const rows = await Data.readFile(file), p = Data.plan(rows);
      const list = (arr, fn) => arr.slice(0, 12).map(fn).join('') + (arr.length > 12 ? '<div class="muted small">… و' + Util.num(arr.length - 12) + ' أخرى</div>' : '');
      box.innerHTML = `<div class="fb"><b>معاينة (لم يُكتب شيء بعد)</b><div>الصفوف: ${Util.num(p.total)} · ✅ جاهز للإضافة: <b>${Util.num(p.valid.length)}</b> · ♻️ موجود بالفعل: ${Util.num(p.dupDb.length)} · 🔁 مكرر داخل الملف: ${Util.num(p.dupFile.length)} · ❌ أخطاء: ${Util.num(p.invalid.length)}</div></div>
      ${p.dupDb.length ? '<details><summary>الموجودة بالفعل</summary>' + list(p.dupDb, x => `<div class="li static"><span>${App.en(x.en)}</span><span>سطر ${x.line}</span></div>`) + '</details>' : ''}
      ${p.dupFile.length ? '<details><summary>المكررة داخل الملف</summary>' + list(p.dupFile, x => `<div class="li static"><span>${App.en(x.en)}</span><span>سطر ${x.line}</span></div>`) + '</details>' : ''}
      ${p.invalid.length ? '<details open><summary>أخطاء التحقق</summary>' + list(p.invalid, x => `<div class="li static err"><span>سطر ${x.line}: ${App.en(x.en)}</span><span>${Util.esc(x.errs.join('، '))}</span></div>`) + '</details>' : ''}
      <button class="btn big" id="d-go" ${p.valid.length ? '' : 'disabled'}>إضافة ${Util.num(p.valid.length)} مصطلح جديد</button>`;
      const go = $('#d-go'); if (go) go.onclick = async () => { go.disabled = true; const r = await Data.commit(p, file.name); box.innerHTML = `<div class="fb ok">✅ أُضيف ${Util.num(r.added)} مصطلح. ${r.dup ? 'رفضت القاعدة ' + Util.num(r.dup) + ' مكرراً.' : ''} تقدّمك لم يتغير.</div>`; };
    } catch (err) { box.innerHTML = '<div class="fb bad">❌ تعذّرت قراءة الملف: ' + Util.esc(err.message) + '</div>'; }
    e.target.value = '';
  };
  $('#n-add').onclick = async () => {
    const g = id => $('#' + id).value, res = $('#n-res');
    const r = await Data.addOne({ en: g('n-en'), pr: g('n-pr'), ar: g('n-ar'), sm: g('n-sm'), ex: g('n-ex'), exa: g('n-exa'), c: g('n-c'), l: g('n-l'), p: g('n-p'), rt: g('n-rt'), rel: g('n-rel'), df: g('n-df') });
    if (!r.ok) { res.innerHTML = '<div class="fb bad">❌ ' + r.errs.map(Util.esc).join('<br>❌ ') + '</div>'; return; }
    res.innerHTML = '<div class="fb ok">✅ تمت إضافة: ' + App.en(r.rec.en) + '</div>';
    ['n-en', 'n-pr', 'n-ar', 'n-sm', 'n-ex', 'n-exa', 'n-rt', 'n-rel', 'n-df'].forEach(id => $('#' + id).value = '');
  };
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot()); else App.boot();

</script>
</body>
</html>
